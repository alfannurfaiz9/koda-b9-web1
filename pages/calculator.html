<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>

    <link rel="stylesheet" href="calculator.css" />
  </head>
  <body>
    <main>
      <h1>Calculator</h1>
      <div class="input">
        <p>0</p>
      </div>
      <div class="container">
        <div class="left">
          <div>Deg | Rad</div>
          <div>x!</div>
          <div>lnv</div>
          <div>sin</div>
          <div>ln</div>
          <div>Pi</div>
          <div>cos</div>
          <div>log</div>
          <div>e</div>
          <div>tan</div>
          <div>V</div>
          <div>Ans</div>
          <div>EXP</div>
          <div>Xy</div>
        </div>
        <div class="right">
          <div>&#40</div>
          <div>&#41</div>
          <div>%</div>
          <div>AC</div>
          <div>7</div>
          <div>8</div>
          <div>9</div>
          <div>x</div>
          <div>4</div>
          <div>5</div>
          <div>6</div>
          <div>÷</div>
          <div>1</div>
          <div>2</div>
          <div>3</div>
          <div>-</div>
          <div>0</div>
          <div>.</div>
          <div>=</div>
          <div>+</div>
        </div>
      </div>
    </main>
  </body>
</html>
